name: Lean

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Require the dependency lockfile
        run: test -f lake-manifest.json
      - name: Check project proof sources
        # Conservative source check: includes drafts and comments, excludes dependencies.
        run: |
          if grep -RnE '\b(sorry|admit|axiom|sorryAx)\b' Olympiad Olympiad.lean --include='*.lean'; then
            echo 'Remove proof placeholders or project axioms from Lean sources.'
            exit 1
          fi
      - uses: leanprover/lean-action@v1
        with:
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
